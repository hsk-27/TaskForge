spring:
  application:
    name: taskforge-backend-test
  datasource:
    url: jdbc:h2:mem:taskforgetestdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

taskforge:
  engine:
    worker-count: 2
    eco-mode: true
    queue-capacity: 100
    max-attempts: 3
    base-backoff-ms: 1000
    max-backoff-ms: 30000
    jitter-factor: 0.1
    drain-timeout-seconds: 15
    stale-job-timeout-minutes: 5
    poll-interval-ms: 200
